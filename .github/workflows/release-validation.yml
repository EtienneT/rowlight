name: Release package validation
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Native builds run containing the Windows cloud packages
        type: string
        required: true
      rebuild_installer:
        description: Test the current installer recipe with the existing application binary
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ inputs.run_id }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PACKAGE_RUN_ID: ${{ inputs.run_id }}
      GH_TOKEN: ${{ github.token }}
      PACKAGE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify the existing native downloads
        shell: pwsh
        run: |
          gh run download $env:PACKAGE_RUN_ID --repo $env:PACKAGE_REPOSITORY --name tablelamp-windows-x64 --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download the native packages.' }
          foreach ($checksum in Get-ChildItem dist -Filter '*.sha256') {
            $fields = (Get-Content $checksum.FullName -Raw).Trim() -split '\s+'
            if ($fields.Count -ne 2 -or $fields[0] -notmatch '^[a-fA-F0-9]{64}$' -or [IO.Path]::GetFileName($fields[1]) -ne $fields[1]) { throw 'Invalid package checksum.' }
            if ((Get-FileHash (Join-Path 'dist' $fields[1]) -Algorithm SHA256).Hash -ne $fields[0]) { throw 'Package checksum mismatch.' }
          }
          $archives = @(Get-ChildItem dist -Filter '*-windows-x64-cloud.zip')
          if ($archives.Count -ne 1) { throw 'Expected one Windows cloud ZIP.' }
          Expand-Archive $archives[0].FullName -DestinationPath dist/windows
      - name: Compile the current installer recipe
        if: inputs.rebuild_installer
        shell: pwsh
        run: |
          $version = ((Get-Content Cargo.toml -Raw) | Select-String '(?m)^version = "([^"]+)"').Matches[0].Groups[1].Value
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $iscc = if ($compiler) { $compiler.Source } else { Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe' }
          & $iscc "/DAppVersion=$version" '/DPackageSuffix=-cloud' 'packaging/windows/parquetviewer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer compilation failed.' }
      - name: Installation, legacy upgrade and removal
        shell: pwsh
        run: ./scripts/package-windows-smoke.ps1
      - name: Upload the tested installer preview
        if: inputs.rebuild_installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: tablelamp-windows-installer-preview
          path: dist/*-windows-x64-cloud-setup.exe
          if-no-files-found: error
          retention-days: 7
