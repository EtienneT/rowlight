name: Native builds
on:
  push:
    # Branch pushes with an open PR are covered by pull_request below.
    branches: [main]
    paths-ignore:
      - README.md
      - 'docs/**'
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: Build optimized core and cloud packages for every platform
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    # Never use private-repository minutes, even if this workflow is re-enabled.
    if: ${{ github.event.repository.private == false }}
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    # Release builds are explicit and need more time than development checks.
    timeout-minutes: ${{ inputs.packages && 90 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            build_jobs: 4
          - os: windows-2025
            platform: windows-x64
            build_jobs: 4
          - os: macos-15
            platform: macos-arm64
            # The standard Apple Silicon runner has only 7 GB RAM.
            build_jobs: 2
          - os: macos-15-intel
            platform: macos-x64
            build_jobs: 3
    env:
      CARGO_BUILD_JOBS: ${{ matrix.build_jobs }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libwayland-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libvulkan-dev clang cmake
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep native dependency builds available while fixing a later check.
          cache-on-failure: true
          # PRs restore the main-branch cache without filling storage per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - name: Core lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Cloud and UI lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Data, remote, viewer and development runner tests
        # One feature set avoids linking/running the core tests a second time.
        # Keep reporting UI/runner results if a data test fails.
        run: cargo test --locked --workspace --all-targets --all-features --no-fail-fast
      - name: Development runner startup
        run: cargo dev --once -- --help
      - name: Data smoke test with a Unicode filename
        shell: bash
        run: |
          mkdir -p samples
          cargo run --locked --all-features --example sample -- 'samples/résultats 100%.parquet' 2501
          cargo run --locked --all-features --example inspect -- 'samples/résultats 100%.parquet' 2000
          cargo run --locked --all-features --example inspect -- 'samples/résultats 100%.parquet' all
          for format in ipc csv tsv; do
            cargo run --locked --all-features --example sample -- "samples/native.$format" 2501
            cargo run --locked --all-features --example inspect -- "samples/native.$format" 2000
          done
      - name: Linux release artifact
        if: github.event_name == 'workflow_dispatch' && inputs.packages && runner.os == 'Linux'
        shell: bash
        run: ./scripts/package-linux.sh && ./scripts/package-linux.sh --cloud
      - name: macOS application and ZIP
        if: github.event_name == 'workflow_dispatch' && inputs.packages && runner.os == 'macOS'
        run: ./scripts/package-macos.sh && ./scripts/package-macos.sh --cloud
      - name: Windows portable ZIP and installer
        if: github.event_name == 'workflow_dispatch' && inputs.packages && runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1
          ./scripts/package-windows.ps1 -Cloud
      - name: Upload native packages
        if: github.event_name == 'workflow_dispatch' && inputs.packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: parquetviewer-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
