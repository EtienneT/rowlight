[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
description = "Native development preview and restart-on-save runner"

[dependencies]
ctrlc = "3.5.2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
